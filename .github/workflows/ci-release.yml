name: "CI & Release"
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      feature:
        description: "Feature to test (leave empty for all)"
        required: false
        default: ""

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Run pre-commit
        run: pre-commit run --all-files

  detect-features:
    runs-on: ubuntu-latest
    outputs:
      features: ${{ steps.get-features.outputs.features }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Get features
        id: get-features
        run: |
          features=$(./.github/scripts/get-features.sh)
          echo "features=$(echo "$features" | tr -d '\n')" >> $GITHUB_OUTPUT

  test:
    runs-on: ubuntu-latest
    needs: [pre-commit, detect-features]
    strategy:
      fail-fast: false
      matrix:
        features: ${{ fromJson(needs.detect-features.outputs.features || '["postgresql"]') }}
        baseImage:
          - debian:latest
          - ubuntu:latest
          - mcr.microsoft.com/devcontainers/base:ubuntu
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: "Install latest devcontainer CLI"
        run: npm install -g @devcontainers/cli

      - name: "Test '${{ matrix.features }}' on '${{ matrix.baseImage }}'"
        run: |
          SKIP_AUTO=""
          if [ "${{ matrix.features }}" = "nrf-tools" ]; then SKIP_AUTO="--skip-autogenerated"; fi
          devcontainer features test --skip-scenarios ${SKIP_AUTO} -f ${{ matrix.features }} -i ${{ matrix.baseImage }} .

  test-scenarios:
    runs-on: ubuntu-latest
    needs: [pre-commit, detect-features]
    strategy:
      fail-fast: false
      matrix:
        features: ${{ fromJson(needs.detect-features.outputs.features || '["postgresql"]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: "Install latest devcontainer CLI"
        run: npm install -g @devcontainers/cli

      - name: "Test '${{ matrix.features }}' scenarios"
        run: devcontainer features test -f ${{ matrix.features }} --skip-autogenerated .

  test-global:
    runs-on: ubuntu-latest
    needs: pre-commit
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: "Install latest devcontainer CLI"
        run: npm install -g @devcontainers/cli

      - name: "Test global scenarios"
        run: devcontainer features test --global-scenarios-only .

  test-postgresql-versions:
    runs-on: ubuntu-latest
    needs: pre-commit
    strategy:
      fail-fast: false
      matrix:
        version: [11, 12, 13, 14, 15, 16, 17, latest]
        baseImage:
          - ubuntu:latest
          - debian:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: "Install latest devcontainer CLI"
        run: npm install -g @devcontainers/cli

      - name: "Test PostgreSQL ${{ matrix.version }} on ${{ matrix.baseImage }}"
        run: |
          mkdir -p .tmp-test/.devcontainer
          cp -r src .tmp-test/.devcontainer/
          echo '{
            "image": "${{ matrix.baseImage }}",
            "features": {
              "./src/postgresql": {
                "version": "${{ matrix.version }}"
              }
            }
          }' > .tmp-test/.devcontainer/devcontainer.json
          cd .tmp-test
          devcontainer up --workspace-folder .
          devcontainer exec --workspace-folder . psql --version
          devcontainer exec --workspace-folder . which postgres
          devcontainer exec --workspace-folder . bash -c "ls -la /usr/local/bin/psql"
          cd ..
          rm -rf .tmp-test

  test-uv-versions:
    runs-on: ubuntu-latest
    needs: pre-commit
    strategy:
      fail-fast: false
      matrix:
        version: [latest, 0.6.17, 0.7.22, 0.8.12, 0.8.13, 0.8.14]
        baseImage:
          - mcr.microsoft.com/devcontainers/python:3.11
          - mcr.microsoft.com/devcontainers/python:3.12
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: "Install latest devcontainer CLI"
        run: npm install -g @devcontainers/cli

      - name: "Test uv ${{ matrix.version }} on ${{ matrix.baseImage }}"
        run: |
          mkdir -p .tmp-test/.devcontainer
          cp -r src .tmp-test/.devcontainer/
          echo '{
            "image": "${{ matrix.baseImage }}",
            "features": {
              "./src/uv": {
                "version": "${{ matrix.version }}"
              }
            }
          }' > .tmp-test/.devcontainer/devcontainer.json
          cd .tmp-test
          devcontainer up --workspace-folder .
          devcontainer exec --workspace-folder . uv --version
          devcontainer exec --workspace-folder . which uv
          devcontainer exec --workspace-folder . bash -c "ls -la /usr/local/bin/uv"
          cd ..
          rm -rf .tmp-test

  test-uv-base-images:
    runs-on: ubuntu-latest
    needs: pre-commit
    strategy:
      fail-fast: false
      matrix:
        baseImage:
          - ubuntu:latest
          - debian:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: "Install latest devcontainer CLI"
        run: npm install -g @devcontainers/cli

      - name: "Test uv on ${{ matrix.baseImage }}"
        run: |
          mkdir -p .tmp-test/.devcontainer
          cp -r src .tmp-test/.devcontainer/
          echo '{
            "image": "${{ matrix.baseImage }}",
            "features": {
              "./src/uv": {
                "version": "latest"
              }
            }
          }' > .tmp-test/.devcontainer/devcontainer.json
          cd .tmp-test
          devcontainer up --workspace-folder .
          devcontainer exec --workspace-folder . uv --version
          devcontainer exec --workspace-folder . which uv
          devcontainer exec --workspace-folder . bash -c "ls -la /usr/local/bin/uv"
          devcontainer exec --workspace-folder . bash -c "python3 --version || echo 'Python3 not available'"
          devcontainer exec --workspace-folder . bash -c "uv pip --help"
          cd ..
          rm -rf .tmp-test

  # ── Release-Jobs (nur auf main, nicht in PRs) ─────────────────────────────

  version:
    runs-on: ubuntu-latest
    needs: detect-features
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        feature: ${{ fromJson(needs.detect-features.outputs.features) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve version for ${{ matrix.feature }}
        id: version
        run: |
          feature="${{ matrix.feature }}"
          feature_file="src/${feature}/devcontainer-feature.json"
          current_version=$(jq -r '.version' "${feature_file}")

          if ! [[ "${current_version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version '${current_version}' in ${feature_file}. Expected SemVer X.Y.Z"
            exit 1
          fi

          tag="${feature}/v${current_version}"
          changed=false

          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null 2>&1 || \
             git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "Tag ${tag} already exists. No release needed."
          else
            changed=true
            echo "Tag ${tag} does not exist. Release needed."
          fi

          echo "version=${current_version}" >> "$GITHUB_OUTPUT"
          echo "changed=${changed}" >> "$GITHUB_OUTPUT"

      - name: Create feature version tag
        if: steps.version.outputs.changed == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          tag="${{ matrix.feature }}/v${{ steps.version.outputs.version }}"

          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null || \
             git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null; then
            echo "Tag ${tag} already exists. Skipping creation."
          else
            git tag "${tag}"
            git push origin "${tag}"
          fi

      - name: Save version info
        run: |
          mkdir -p version-info
          {
            echo "FEATURE=${{ matrix.feature }}"
            echo "VERSION=${{ steps.version.outputs.version }}"
            echo "VERSION_TAG=${{ matrix.feature }}/v${{ steps.version.outputs.version }}"
            echo "CHANGED=${{ steps.version.outputs.changed }}"
          } > version-info/info.env

      - name: Upload version info
        uses: actions/upload-artifact@v4
        with:
          name: version-${{ matrix.feature }}
          path: version-info/info.env

  summarize-changes:
    runs-on: ubuntu-latest
    needs: version
    if: github.event_name != 'pull_request'
    permissions:
      actions: read
    outputs:
      any_changed: ${{ steps.check.outputs.any_changed }}
    steps:
      - name: Download all version artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: version-*
          path: ./version-artifacts

      - name: Check if any feature changed
        id: check
        run: |
          any_changed=false
          for artifact_dir in ./version-artifacts/version-*/; do
            if grep -q "CHANGED=true" "${artifact_dir}/info.env" 2>/dev/null; then
              any_changed=true
              break
            fi
          done
          echo "any_changed=${any_changed}" >> $GITHUB_OUTPUT

  create-releases:
    runs-on: ubuntu-latest
    needs:
      [
        summarize-changes,
        test,
        test-scenarios,
        test-global,
        test-postgresql-versions,
        test-uv-versions,
        test-uv-base-images,
      ]
    if: |
      github.event_name != 'pull_request' &&
      needs.summarize-changes.outputs.any_changed == 'true'
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Download all version artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: version-*
          path: ./version-artifacts

      - name: Create per-feature releases
        run: |
          ENTRIES=""
          for artifact_dir in ./version-artifacts/version-*/; do
            F_FEATURE=$(grep "^FEATURE=" "${artifact_dir}/info.env" | cut -d= -f2)
            F_VERSION=$(grep "^VERSION=" "${artifact_dir}/info.env" | cut -d= -f2)
            ENTRY="    \"ghcr.io/the78mole/devcontainer-features/${F_FEATURE}:${F_VERSION}\": {}"
            if [[ -n "$ENTRIES" ]]; then
              ENTRIES="${ENTRIES},"$'\n'"${ENTRY}"
            else
              ENTRIES="${ENTRY}"
            fi
          done

          DEVCONTAINER_EXAMPLE=$(printf '{\n  "features": {\n%s\n  }\n}' "${ENTRIES}")

          for artifact_dir in ./version-artifacts/version-*/; do
            F_FEATURE=$(grep "^FEATURE=" "${artifact_dir}/info.env" | cut -d= -f2)
            F_VERSION=$(grep "^VERSION=" "${artifact_dir}/info.env" | cut -d= -f2)
            F_VERSION_TAG=$(grep "^VERSION_TAG=" "${artifact_dir}/info.env" | cut -d= -f2)
            F_CHANGED=$(grep "^CHANGED=" "${artifact_dir}/info.env" | cut -d= -f2)

            if [[ "$F_CHANGED" == "true" ]]; then
              F_NAME=$(jq -r '.name // .id' "src/${F_FEATURE}/devcontainer-feature.json")
              F_DESC=$(jq -r '.description // "No description"' "src/${F_FEATURE}/devcontainer-feature.json")

              RELEASE_NOTES=$(printf '## %s %s\n\n%s\n\n### Usage\n\nAdd to your `devcontainer.json`:\n\n```json\n%s\n```' \
                "${F_NAME}" "${F_VERSION}" "${F_DESC}" "${DEVCONTAINER_EXAMPLE}")
              gh release create "${F_VERSION_TAG}" \
                --title "${F_NAME} ${F_VERSION}" \
                --notes "${RELEASE_NOTES}"
            fi
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    runs-on: ubuntu-latest
    needs: [create-releases]
    if: |
      github.event_name != 'pull_request' &&
      needs.create-releases.result == 'success'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: "Publish Features to ghcr.io"
        uses: devcontainers/action@v1
        with:
          publish-features: "true"
          base-path-to-features: "./src"
          generate-docs: "true"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
