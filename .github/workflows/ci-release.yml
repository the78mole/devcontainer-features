name: "CI & Release"
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      feature:
        description: "Feature to test (leave empty for all)"
        required: false
        default: ""

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Run pre-commit
        run: pre-commit run --all-files

  detect-features:
    runs-on: ubuntu-latest
    outputs:
      features: ${{ steps.get-features.outputs.features }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Get features
        id: get-features
        run: |
          features=$(./.github/scripts/get-features.sh)
          echo "features=$(echo "$features" | tr -d '\n')" >> $GITHUB_OUTPUT

  test:
    runs-on: ubuntu-latest
    needs: [pre-commit, detect-features]
    strategy:
      fail-fast: false
      matrix:
        features: ${{ fromJson(needs.detect-features.outputs.features || '["postgresql"]') }}
        baseImage:
          - debian:latest
          - ubuntu:latest
          - mcr.microsoft.com/devcontainers/base:ubuntu
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: "Install latest devcontainer CLI"
        run: npm install -g @devcontainers/cli

      - name: Get date for cache key
        id: date
        run: echo "date=$(date -u +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Cache Docker base image
        uses: actions/cache@v4
        with:
          path: /tmp/docker-images
          key: docker-${{ matrix.baseImage }}-${{ steps.date.outputs.date }}
          restore-keys: docker-${{ matrix.baseImage }}-

      - name: Load or pull base image
        run: |
          img="${{ matrix.baseImage }}"
          filename="/tmp/docker-images/$(echo "${img}" | tr '/:.' '-').tar"
          if [ -f "${filename}" ]; then
            echo "Loading cached image: ${img}"
            docker load -i "${filename}"
          else
            echo "Pulling image: ${img}"
            docker pull "${img}"
            mkdir -p /tmp/docker-images
            docker save "${img}" -o "${filename}"
          fi

      - name: "Test '${{ matrix.features }}' on '${{ matrix.baseImage }}'"
        run: |
          SKIP_AUTO=""
          if [ "${{ matrix.features }}" = "nrf-tools" ]; then SKIP_AUTO="--skip-autogenerated"; fi
          devcontainer features test --skip-scenarios ${SKIP_AUTO} -f ${{ matrix.features }} -i ${{ matrix.baseImage }} .

  test-scenarios:
    runs-on: ubuntu-latest
    needs: [pre-commit, detect-features]
    strategy:
      fail-fast: false
      matrix:
        features: ${{ fromJson(needs.detect-features.outputs.features || '["postgresql"]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: "Install latest devcontainer CLI"
        run: npm install -g @devcontainers/cli

      - name: "Test '${{ matrix.features }}' scenarios"
        run: devcontainer features test -f ${{ matrix.features }} --skip-autogenerated .

  test-global:
    runs-on: ubuntu-latest
    needs: pre-commit
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: "Install latest devcontainer CLI"
        run: npm install -g @devcontainers/cli

      - name: "Test global scenarios"
        run: devcontainer features test --global-scenarios-only .

  test-postgresql-versions:
    runs-on: ubuntu-latest
    needs: pre-commit
    strategy:
      fail-fast: false
      matrix:
        version: [11, 12, 13, 14, 15, 16, 17, latest]
        baseImage:
          - ubuntu:latest
          - debian:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: "Install latest devcontainer CLI"
        run: npm install -g @devcontainers/cli

      - name: Get date for cache key
        id: date
        run: echo "date=$(date -u +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Cache Docker base image
        uses: actions/cache@v4
        with:
          path: /tmp/docker-images
          key: docker-${{ matrix.baseImage }}-${{ steps.date.outputs.date }}
          restore-keys: docker-${{ matrix.baseImage }}-

      - name: Load or pull base image
        run: |
          img="${{ matrix.baseImage }}"
          filename="/tmp/docker-images/$(echo "${img}" | tr '/:.' '-').tar"
          if [ -f "${filename}" ]; then
            echo "Loading cached image: ${img}"
            docker load -i "${filename}"
          else
            echo "Pulling image: ${img}"
            docker pull "${img}"
            mkdir -p /tmp/docker-images
            docker save "${img}" -o "${filename}"
          fi

      - name: "Test PostgreSQL ${{ matrix.version }} on ${{ matrix.baseImage }}"
        run: |
          mkdir -p .tmp-test/.devcontainer
          cp -r src .tmp-test/.devcontainer/
          echo '{
            "image": "${{ matrix.baseImage }}",
            "features": {
              "./src/postgresql": {
                "version": "${{ matrix.version }}"
              }
            }
          }' > .tmp-test/.devcontainer/devcontainer.json
          cd .tmp-test
          devcontainer up --workspace-folder .
          devcontainer exec --workspace-folder . psql --version
          devcontainer exec --workspace-folder . which postgres
          devcontainer exec --workspace-folder . bash -c "ls -la /usr/local/bin/psql"
          cd ..
          rm -rf .tmp-test

  test-uv-versions:
    runs-on: ubuntu-latest
    needs: pre-commit
    strategy:
      fail-fast: false
      matrix:
        version: [latest, 0.6.17, 0.7.22, 0.8.12, 0.8.13, 0.8.14]
        baseImage:
          - mcr.microsoft.com/devcontainers/python:3.11
          - mcr.microsoft.com/devcontainers/python:3.12
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: "Install latest devcontainer CLI"
        run: npm install -g @devcontainers/cli

      - name: Get date for cache key
        id: date
        run: echo "date=$(date -u +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Cache Docker base image
        uses: actions/cache@v4
        with:
          path: /tmp/docker-images
          key: docker-${{ matrix.baseImage }}-${{ steps.date.outputs.date }}
          restore-keys: docker-${{ matrix.baseImage }}-

      - name: Load or pull base image
        run: |
          img="${{ matrix.baseImage }}"
          filename="/tmp/docker-images/$(echo "${img}" | tr '/:.' '-').tar"
          if [ -f "${filename}" ]; then
            echo "Loading cached image: ${img}"
            docker load -i "${filename}"
          else
            echo "Pulling image: ${img}"
            docker pull "${img}"
            mkdir -p /tmp/docker-images
            docker save "${img}" -o "${filename}"
          fi

      - name: "Test uv ${{ matrix.version }} on ${{ matrix.baseImage }}"
        run: |
          mkdir -p .tmp-test/.devcontainer
          cp -r src .tmp-test/.devcontainer/
          echo '{
            "image": "${{ matrix.baseImage }}",
            "features": {
              "./src/uv": {
                "version": "${{ matrix.version }}"
              }
            }
          }' > .tmp-test/.devcontainer/devcontainer.json
          cd .tmp-test
          devcontainer up --workspace-folder .
          devcontainer exec --workspace-folder . uv --version
          devcontainer exec --workspace-folder . which uv
          devcontainer exec --workspace-folder . bash -c "ls -la /usr/local/bin/uv"
          cd ..
          rm -rf .tmp-test

  test-uv-base-images:
    runs-on: ubuntu-latest
    needs: pre-commit
    strategy:
      fail-fast: false
      matrix:
        baseImage:
          - ubuntu:latest
          - debian:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: "Install latest devcontainer CLI"
        run: npm install -g @devcontainers/cli

      - name: Get date for cache key
        id: date
        run: echo "date=$(date -u +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Cache Docker base image
        uses: actions/cache@v4
        with:
          path: /tmp/docker-images
          key: docker-${{ matrix.baseImage }}-${{ steps.date.outputs.date }}
          restore-keys: docker-${{ matrix.baseImage }}-

      - name: Load or pull base image
        run: |
          img="${{ matrix.baseImage }}"
          filename="/tmp/docker-images/$(echo "${img}" | tr '/:.' '-').tar"
          if [ -f "${filename}" ]; then
            echo "Loading cached image: ${img}"
            docker load -i "${filename}"
          else
            echo "Pulling image: ${img}"
            docker pull "${img}"
            mkdir -p /tmp/docker-images
            docker save "${img}" -o "${filename}"
          fi

      - name: "Test uv on ${{ matrix.baseImage }}"
        run: |
          mkdir -p .tmp-test/.devcontainer
          cp -r src .tmp-test/.devcontainer/
          echo '{
            "image": "${{ matrix.baseImage }}",
            "features": {
              "./src/uv": {
                "version": "latest"
              }
            }
          }' > .tmp-test/.devcontainer/devcontainer.json
          cd .tmp-test
          devcontainer up --workspace-folder .
          devcontainer exec --workspace-folder . uv --version
          devcontainer exec --workspace-folder . which uv
          devcontainer exec --workspace-folder . bash -c "ls -la /usr/local/bin/uv"
          devcontainer exec --workspace-folder . bash -c "python3 --version || echo 'Python3 not available'"
          devcontainer exec --workspace-folder . bash -c "uv pip --help"
          cd ..
          rm -rf .tmp-test

  # ── Release-Jobs (nur auf main, nicht in PRs) ─────────────────────────────

  version:
    runs-on: ubuntu-latest
    needs: detect-features
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        feature: ${{ fromJson(needs.detect-features.outputs.features) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Create feature version tag for ${{ matrix.feature }}
        run: |
          feature="${{ matrix.feature }}"
          feature_file="src/${feature}/devcontainer-feature.json"
          current_version=$(jq -r '.version' "${feature_file}")

          if ! [[ "${current_version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version '${current_version}' in ${feature_file}. Expected SemVer X.Y.Z"
            exit 1
          fi

          tag="${feature}/v${current_version}"
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null 2>&1 || \
             git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "Tag ${tag} already exists. Skipping."
          else
            git config --local user.email "action@github.com"
            git config --local user.name "GitHub Action"
            git tag "${tag}"
            git push origin "${tag}"
            echo "Created tag ${tag}."
          fi

  global-release:
    runs-on: ubuntu-latest
    needs:
      - version
      - test
      - test-scenarios
      - test-global
      - test-postgresql-versions
      - test-uv-versions
      - test-uv-base-images
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Determine next global version
        id: global_version
        run: |
          latest_tag=$(git describe --tags --match "v[0-9]*" --abbrev=0 2>/dev/null || echo "v0.0.0")
          latest_version="${latest_tag#v}"
          IFS='.' read -r major minor patch <<< "$latest_version"

          commit_subject=$(git log -1 --format="%s")
          commit_body=$(git log -1 --format="%b")
          full_msg="${commit_subject}"$'\n'"${commit_body}"

          if echo "$full_msg" | grep -qE "^(feat|fix)(\([^)]+\))?!:|BREAKING CHANGE"; then
            major=$((major + 1)); minor=0; patch=0
          elif echo "$full_msg" | grep -qE "^feat(\([^)]+\))?:"; then
            minor=$((minor + 1)); patch=0
          else
            patch=$((patch + 1))
          fi

          next="v${major}.${minor}.${patch}"
          echo "version=${next}" >> "$GITHUB_OUTPUT"
          # Escape subject for safe use in subsequent steps
          echo "subject=${commit_subject}" >> "$GITHUB_OUTPUT"

      - name: Detect changed features
        id: changed
        run: |
          changed_list=""
          for feature_dir in src/*/; do
            feature=$(basename "$feature_dir")
            if git diff --name-only HEAD~1..HEAD -- "$feature_dir" | grep -q .; then
              changed_list="${changed_list}${feature} "
            fi
          done
          echo "features=${changed_list% }" >> "$GITHUB_OUTPUT"

      - name: Build release notes
        run: |
          version="${{ steps.global_version.outputs.version }}"
          subject="${{ steps.global_version.outputs.subject }}"
          commit_body=$(git log -1 --format="%b")
          changed_features="${{ steps.changed.outputs.features }}"

          {
            echo "## ${version} — ${subject}"
            echo ""
            if [[ -n "${commit_body}" ]]; then
              echo "${commit_body}"
              echo ""
            fi

            if [[ -n "${changed_features}" ]]; then
              echo "### Changed Features"
              echo ""
              for feature in ${changed_features}; do
                feature_json="src/${feature}/devcontainer-feature.json"
                name=$(jq -r '.name // .id' "${feature_json}")
                fversion=$(jq -r '.version' "${feature_json}")
                desc=$(jq -r '.description // ""' "${feature_json}")
                major_ver="${fversion%%.*}"

                echo "#### ${name} \`${fversion}\`"
                echo ""
                [[ -n "${desc}" ]] && echo "_${desc}_" && echo ""
                echo '**devcontainer-feature.json:**'
                echo '```json'
                jq '.' "${feature_json}"
                echo '```'
                echo ""
                echo '**Usage:**'
                echo '```json'
                printf '{\n  "features": {\n    "ghcr.io/the78mole/devcontainer-features/%s:%s": {}\n  }\n}\n' \
                  "${feature}" "${major_ver}"
                echo '```'
                echo ""
              done
            else
              echo "### No Feature Changes"
              echo ""
              echo "This release contains tooling, CI, or documentation updates."
              echo ""
            fi

            echo "### All Available Features"
            echo ""
            echo "| Feature | Version | Description |"
            echo "|---------|---------|-------------|"
            for feature_dir in src/*/; do
              feature=$(basename "$feature_dir")
              feature_json="src/${feature}/devcontainer-feature.json"
              fversion=$(jq -r '.version' "${feature_json}")
              name=$(jq -r '.name // .id' "${feature_json}")
              desc=$(jq -r '.description // ""' "${feature_json}")
              echo "| [\`${feature}\`](https://github.com/the78mole/devcontainer-features/tree/main/src/${feature}) | \`${fversion}\` | ${desc} |"
            done
          } > release_notes.md

      - name: Create source tarball
        run: |
          version="${{ steps.global_version.outputs.version }}"
          tar -czf "devcontainer-features-${version}-src.tar.gz" src/

      - name: Tag and publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${{ steps.global_version.outputs.version }}"
          subject="${{ steps.global_version.outputs.subject }}"
          tarball="devcontainer-features-${version}-src.tar.gz"

          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          if git rev-parse -q --verify "refs/tags/${version}" >/dev/null 2>&1 || \
             git ls-remote --exit-code --tags origin "refs/tags/${version}" >/dev/null 2>&1; then
            echo "Global tag ${version} already exists. Skipping tag creation."
          else
            git tag "${version}"
            git push origin "${version}"
          fi

          if gh release view "${version}" >/dev/null 2>&1; then
            echo "Release ${version} already exists. Skipping."
          else
            gh release create "${version}" \
              --title "${version} — ${subject}" \
              --notes-file release_notes.md \
              "${tarball}"
          fi

  deploy:
    runs-on: ubuntu-latest
    needs: [global-release]
    if: |
      github.event_name != 'pull_request' &&
      needs.global-release.result == 'success'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: "Publish Features to ghcr.io"
        uses: devcontainers/action@v1
        with:
          publish-features: "true"
          base-path-to-features: "./src"
          generate-docs: "true"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
