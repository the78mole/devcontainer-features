name: "Release"
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  detect-features:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      features: ${{ steps.get-features.outputs.features }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Get features
        id: get-features
        run: |
          features=$(./.github/scripts/get-features.sh)
          echo "features=$(echo "$features" | tr -d '\n')" >> $GITHUB_OUTPUT

  version:
    runs-on: ubuntu-latest
    needs: detect-features
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        feature: ${{ fromJson(needs.detect-features.outputs.features) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve version for ${{ matrix.feature }}
        id: version
        run: |
          feature="${{ matrix.feature }}"
          feature_file="src/${feature}/devcontainer-feature.json"
          current_version=$(jq -r '.version' "${feature_file}")

          if ! [[ "${current_version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version '${current_version}' in ${feature_file}. Expected SemVer X.Y.Z"
            exit 1
          fi

          base_sha="${{ github.event.before }}"
          if [[ -z "${base_sha}" || "${base_sha}" == "0000000000000000000000000000000000000000" ]]; then
            if git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
              base_sha=$(git rev-parse HEAD~1)
            else
              base_sha=""
            fi
          fi

          changed=false
          previous_version=""
          if [[ -n "${base_sha}" ]] && git cat-file -e "${base_sha}^{commit}" 2>/dev/null; then
            previous_version=$(git show "${base_sha}:${feature_file}" 2>/dev/null | jq -r '.version // empty' || true)
            if [[ "${previous_version}" != "${current_version}" ]]; then
              changed=true
            fi
          fi

          echo "Current version: ${current_version}"
          echo "Previous version: ${previous_version:-<none>}"
          echo "Version changed: ${changed}"

          echo "version=${current_version}" >> "$GITHUB_OUTPUT"
          echo "changed=${changed}" >> "$GITHUB_OUTPUT"

      - name: Create feature version tag
        if: ${{ steps.version.outputs.changed == 'true' && !env.ACT }}
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          tag="${{ matrix.feature }}/v${{ steps.version.outputs.version }}"

          # Make the step idempotent for workflow re-runs.
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null || \
             git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null; then
            echo "Tag ${tag} already exists. Skipping creation."
          else
            git tag "${tag}"
            git push origin "${tag}"
          fi

      - name: Save version info
        run: |
          mkdir -p version-info
          {
            echo "FEATURE=${{ matrix.feature }}"
            echo "VERSION=${{ steps.version.outputs.version }}"
            echo "VERSION_TAG=${{ matrix.feature }}/v${{ steps.version.outputs.version }}"
            echo "CHANGED=${{ steps.version.outputs.changed }}"
          } > version-info/info.env

      - name: Upload version info
        uses: actions/upload-artifact@v4
        with:
          name: version-${{ matrix.feature }}
          path: version-info/info.env

  summarize-changes:
    runs-on: ubuntu-latest
    needs: version
    permissions:
      actions: read
    outputs:
      any_changed: ${{ steps.check.outputs.any_changed }}
    steps:
      - name: Download all version artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: version-*
          path: ./version-artifacts

      - name: Check if any feature changed
        id: check
        run: |
          any_changed=false
          for artifact_dir in ./version-artifacts/version-*/; do
            if grep -q "CHANGED=true" "${artifact_dir}/info.env" 2>/dev/null; then
              any_changed=true
              break
            fi
          done
          echo "any_changed=${any_changed}" >> $GITHUB_OUTPUT

  pre-release-checks:
    runs-on: ubuntu-latest
    needs: summarize-changes
    permissions:
      contents: read
    if: ${{ needs.summarize-changes.outputs.any_changed == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Run pre-commit
        run: pre-commit run --all-files

      - name: Setup jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: "Install latest devcontainer CLI"
        run: npm install -g @devcontainers/cli

      - name: "Test all features"
        run: |
          features=$(./.github/scripts/get-features.sh)
          echo "Testing features: $features"
          devcontainer features test --skip-scenarios . -i ubuntu:latest

  create-releases:
    runs-on: ubuntu-latest
    needs: [summarize-changes, pre-release-checks]
    if: ${{ needs.summarize-changes.outputs.any_changed == 'true' }}
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Download all version artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: version-*
          path: ./version-artifacts

      - name: Create per-feature releases
        if: ${{ !env.ACT }}
        run: |
          # Build full devcontainer.json example with all features at their current versions
          ENTRIES=""
          for artifact_dir in ./version-artifacts/version-*/; do
            F_FEATURE=$(grep "^FEATURE=" "${artifact_dir}/info.env" | cut -d= -f2)
            F_VERSION=$(grep "^VERSION=" "${artifact_dir}/info.env" | cut -d= -f2)
            ENTRY="    \"ghcr.io/the78mole/devcontainer-features/${F_FEATURE}:${F_VERSION}\": {}"
            if [[ -n "$ENTRIES" ]]; then
              ENTRIES="${ENTRIES},"$'\n'"${ENTRY}"
            else
              ENTRIES="${ENTRY}"
            fi
          done

          DEVCONTAINER_EXAMPLE=$(printf '{\n  "features": {\n%s\n  }\n}' "${ENTRIES}")

          # Create a GitHub release for each changed feature
          for artifact_dir in ./version-artifacts/version-*/; do
            F_FEATURE=$(grep "^FEATURE=" "${artifact_dir}/info.env" | cut -d= -f2)
            F_VERSION=$(grep "^VERSION=" "${artifact_dir}/info.env" | cut -d= -f2)
            F_VERSION_TAG=$(grep "^VERSION_TAG=" "${artifact_dir}/info.env" | cut -d= -f2)
            F_CHANGED=$(grep "^CHANGED=" "${artifact_dir}/info.env" | cut -d= -f2)

            if [[ "$F_CHANGED" == "true" ]]; then
              F_NAME=$(jq -r '.name // .id' "src/${F_FEATURE}/devcontainer-feature.json")
              F_DESC=$(jq -r '.description // "No description"' "src/${F_FEATURE}/devcontainer-feature.json")

              RELEASE_NOTES=$(printf '## %s %s\n\n%s\n\n### Usage\n\nAdd to your `devcontainer.json`:\n\n```json\n%s\n```' \
                "${F_NAME}" "${F_VERSION}" "${F_DESC}" "${DEVCONTAINER_EXAMPLE}")
              gh release create "${F_VERSION_TAG}" \
                --title "${F_NAME} ${F_VERSION}" \
                --notes "${RELEASE_NOTES}"
            fi
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    runs-on: ubuntu-latest
    needs: [summarize-changes, create-releases]
    if: ${{ needs.summarize-changes.outputs.any_changed == 'true' }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: "Publish Features"
        if: ${{ !env.ACT }}
        uses: devcontainers/action@v1
        with:
          publish-features: "true"
          base-path-to-features: "./src"
          generate-docs: "true"

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
